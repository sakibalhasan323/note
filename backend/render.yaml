# Note - OPTIONAL backend (advanced branding/settings serving)
# For most users the backend is not required - the static frontend works fully
# on its own with Firebase + localStorage.
services:
  - type: web
    name: note-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: CORS_ORIGINS
        value: "*"
        sync: false