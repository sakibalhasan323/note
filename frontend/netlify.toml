# Netlify config for the Note FRONTEND (static SPA).
# Backend API is optional - the app runs fully with Firebase + localStorage.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA routing: send non-file requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200